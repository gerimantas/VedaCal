<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VedaCal — Flat sky prototype</title>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-body);
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: var(--text-base);
        font-weight: 650;
      }
      .card {
        padding: 12px 14px;
        background: var(--color-card);
        border: 1px solid var(--color-card-line);
        border-radius: 14px;
        font-size: var(--text-sm);
      }
      .card + .card {
        margin-top: 12px;
      }
      svg.chart {
        display: block;
        width: 100%;
        height: auto;
      }
      .rows {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
      }
      .rows dt {
        color: var(--color-muted);
      }
      .rows dd {
        margin: 0;
      }
      .sun {
        color: var(--color-accent);
      }
      .moon {
        color: #9fd3ff;
      }
      .sk {
        color: #d4af37;
      }
      .badge {
        display: inline-block;
        min-width: 1.6em;
        padding: 0 4px;
        border-radius: 4px;
        background: #9fd3ff;
        color: #0b0e14;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .quiet {
        color: var(--color-neutral);
      }
      .seen {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend {
        margin: 6px 0 0;
        padding-left: 18px;
        position: relative;
        color: var(--color-muted);
        font-size: 12px;
      }
      .legend::before {
        content: '';
        position: absolute;
        left: 0;
        top: 4px;
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }
      .legend.l-orbit::before {
        background: oklch(40% 0.03 250);
      }
      .legend.l-nak::before {
        background: #9fd3ff;
      }
      .legend.l-sign::before {
        background: #ffb300;
      }
      .legend.l-note::before {
        display: none;
      }
      .legend.l-note {
        padding-left: 0;
        color: var(--color-neutral);
      }
      .note {
        margin: 8px 0 0;
        color: var(--color-neutral);
        font-size: 12px;
      }
      .when {
        margin-bottom: 6px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .controls input {
        flex: 1;
        accent-color: var(--color-accent);
      }
      button {
        min-width: 44px;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--color-card-line);
        border-radius: 10px;
        background: var(--color-paper-2);
        color: var(--color-ink);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <section class="card"><div id="chart"></div><div id="legend"></div></section>
      <section class="card">
        <dl class="rows" id="rows"></dl>
      </section>
      <section class="card">
        <div class="when" id="when"></div>
        <div class="controls">
          <button id="play" type="button">▶</button>
          <input id="slider" type="range" min="-360" max="360" step="1" value="0" />
          <button id="now" type="button"></button>
        </div>
      </section>
    </main>
    <script type="module" src="./sky-flat.ts"></script>
  </body>
</html>
