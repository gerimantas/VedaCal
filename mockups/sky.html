<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VedaCal — Sky prototype</title>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        color: var(--color-ink);
        font-family: var(--font-body);
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .panel {
        position: fixed;
        left: 12px;
        right: 12px;
        padding: 10px 14px;
        background: rgb(11 14 20 / 0.78);
        border: 1px solid var(--color-card-line);
        border-radius: 14px;
        backdrop-filter: blur(6px);
        font-size: var(--text-sm);
      }
      .top {
        top: 12px;
      }
      .bottom {
        bottom: 12px;
      }
      .top h1 {
        margin: 0 0 4px;
        font-size: var(--text-base);
        font-weight: 650;
      }
      .rows {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
      }
      .rows dt {
        color: var(--color-muted);
      }
      .rows dd {
        margin: 0;
      }
      .sun {
        color: var(--color-accent);
      }
      .moon {
        color: #9fd3ff;
      }
      .note {
        margin-top: 6px;
        color: var(--color-neutral);
        font-size: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .controls input {
        flex: 1;
        accent-color: var(--color-accent);
      }
      button {
        min-width: 44px;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--color-card-line);
        border-radius: 10px;
        background: var(--color-paper-2);
        color: var(--color-ink);
        font: inherit;
      }
      .when {
        margin-bottom: 6px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      @media (min-width: 720px) {
        .panel {
          right: auto;
          width: 340px;
        }
      }
    </style>
  </head>
  <body>
    <section class="panel top" aria-live="polite">
      <h1 id="title">Sky</h1>
      <dl class="rows" id="rows"></dl>
      <p class="note" id="note"></p>
    </section>
    <section class="panel bottom">
      <div class="when" id="when"></div>
      <div class="controls">
        <button id="play" type="button">▶</button>
        <input id="slider" type="range" min="-360" max="360" step="1" value="0" />
        <button id="now" type="button">Now</button>
      </div>
    </section>
    <script type="module" src="./sky.ts"></script>
  </body>
</html>
